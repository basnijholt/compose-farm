name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheel and verify vendored asset digests
        run: uv build --wheel

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Audit locked production dependencies
        run: uv audit --preview-features audit-command --locked --no-dev

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build --tag compose-farm:test .

      - name: Verify arbitrary-UID identity without writable account files
        run: |
          docker run --rm --user 12345:23456 compose-farm:test --version
          docker run --rm --user 12345:23456 --env HOME=/tmp/test-home --entrypoint /bin/sh compose-farm:test -c '
            eval "$(head -n -1 /usr/local/bin/docker-entrypoint.sh)"
            test "$(id -un)" = compose-farm
            ssh -G example.invalid 2>/dev/null | grep -Fqx \
              "userknownhostsfile /tmp/test-home/.ssh/known_hosts /tmp/test-home/.ssh/known_hosts2"
            test "$(stat -c %a /etc/passwd)" = 644
            test ! -w /etc/passwd
          '

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests (excluding browser tests)
        run: uv run pytest -m "not browser"

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run browser tests
        run: uv run pytest -m browser -n auto -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit (via prek)
        uses: j178/prek-action@v3.0.0

<title>Compose Farm</title>
<style>
.o{stroke:#1e2a38;stroke-width:2.2;stroke-linejoin:round}
.o.thin{stroke-width:1.4}
.rib{stroke:#1e2a38;stroke-opacity:.35;stroke-width:1.2}
.furrow{stroke:#3f8f43;stroke-width:2;stroke-linecap:round}
.dash{fill:none;stroke:#1e2a38;stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
.term{fill:none;stroke:#4ade80;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.vcase{fill:none;stroke:#1e2a38;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.vcore{fill:none;stroke:#fbbf24;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.vfill{fill:#fbbf24;stroke:#1e2a38;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wfill{fill:#1e2a38;stroke:none}
.pulse{display:none}
.spin{transform-origin:0 0;animation:spin 10s linear infinite}
@keyframes spin{0%{transform:rotate(0.0deg)}5%{transform:rotate(35.6deg)}10%{transform:rotate(64.5deg)}15%{transform:rotate(82.5deg)}20%{transform:rotate(89.6deg)}25%{transform:rotate(90.0deg)}30%{transform:rotate(90.4deg)}35%{transform:rotate(97.5deg)}40%{transform:rotate(115.5deg)}45%{transform:rotate(144.4deg)}50%{transform:rotate(180.0deg)}55%{transform:rotate(215.6deg)}60%{transform:rotate(244.5deg)}65%{transform:rotate(262.5deg)}70%{transform:rotate(269.6deg)}75%{transform:rotate(270.0deg)}80%{transform:rotate(270.4deg)}85%{transform:rotate(277.5deg)}90%{transform:rotate(295.5deg)}95%{transform:rotate(324.4deg)}100%{transform:rotate(360.0deg)}}
.pulse{display:inline;fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:12 200;stroke-dashoffset:12;animation:pulse 2.8s linear infinite}
.pulse.out{stroke:#facc15;filter:drop-shadow(0 0 3px #f59e0b)}
.pulse.back{stroke:#4ade80;filter:drop-shadow(0 0 3px #16a34a)}
@keyframes pulse{0%{stroke-dashoffset:12}65%,100%{stroke-dashoffset:-100}}
.crop{transform-box:fill-box;transform-origin:50% 100%;animation:grow 12s ease-out infinite both}
@keyframes grow{0%,78%{transform:scale(1)}84%,88%{transform:scale(0)}94%{transform:scale(1.15)}97%,100%{transform:scale(1)}}
.migrant{animation:migrate 12s ease-in-out infinite}
@keyframes migrate{0%,36%{transform:translate(0.0px,0.0px)}39%{transform:translate(0.0px,-14.0px)}44%{transform:translate(-12.1px,-30.0px)}51%{transform:translate(-24.2px,100.0px)}54%,86%{transform:translate(-24.2px,114.0px)}89%{transform:translate(-24.2px,100.0px)}94%{transform:translate(-12.1px,-30.0px)}98%{transform:translate(0.0px,-14.0px)}100%{transform:translate(0.0px,0.0px)}}
.cursor{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.spin,.crop,.migrant,.cursor{animation:none}.pulse{display:none}}
@media (prefers-color-scheme:dark){.dash{stroke:#e6edf3}.wfill{fill:#e6edf3}}
</style>

@media (prefers-reduced-motion:reduce){.spin,.pulse{animation:none}.pulse{display:none}}
.word{fill:none;stroke:#1e2a38;stroke-width:13;stroke-linejoin:miter;stroke-miterlimit:4}
@media (prefers-color-scheme:dark){.dash,.word{stroke:#e6edf3}}

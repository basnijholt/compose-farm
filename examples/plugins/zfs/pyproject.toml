[project]
name = "compose-farm-zfs"
version = "0.1.0"
description = "Example compose-farm plugin: a ZFS dataset per stack that moves with the stack"
requires-python = ">=3.11"
dependencies = ["compose-farm"]

[project.entry-points."compose_farm.plugins"]
zfs = "compose_farm_zfs:ZfsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["compose_farm_zfs.py"]

[project]
name = "compose-farm-agenix"
version = "0.1.0"
description = "Example compose-farm plugin: pass agenix-decrypted secrets to docker compose"
requires-python = ">=3.11"
dependencies = ["compose-farm"]

[project.entry-points."compose_farm.plugins"]
agenix = "compose_farm_agenix:AgenixPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["compose_farm_agenix.py"]

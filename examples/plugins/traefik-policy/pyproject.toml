[project]
name = "compose-farm-traefik-policy"
version = "0.1.0"
description = "Example compose-farm plugin: enforce Traefik routing conventions during preflight"
requires-python = ">=3.11"
dependencies = ["compose-farm"]

[project.entry-points."compose_farm.plugins"]
traefik-policy = "compose_farm_traefik_policy:TraefikPolicyPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["compose_farm_traefik_policy.py"]

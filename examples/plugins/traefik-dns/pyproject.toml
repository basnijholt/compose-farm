[project]
name = "compose-farm-traefik-dns"
version = "0.1.0"
description = "Example compose-farm plugin: keep DNS records in sync with Traefik hostnames"
requires-python = ">=3.11"
dependencies = ["compose-farm"]

[project.entry-points."compose_farm.plugins"]
traefik-dns = "compose_farm_traefik_dns:TraefikDnsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["compose_farm_traefik_dns.py"]

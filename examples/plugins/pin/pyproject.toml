[project]
name = "compose-farm-pin"
version = "0.1.0"
description = "Example compose-farm plugin: keep stacks on the host they must run on"
requires-python = ">=3.11"
dependencies = ["compose-farm"]

[project.entry-points."compose_farm.plugins"]
pin = "compose_farm_pin:PinPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["compose_farm_pin.py"]
